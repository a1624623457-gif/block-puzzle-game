<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方块消除">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="8×8 棋盘方块消除游戏 - 支持1-4人对战">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi5pa55Z2X5raI6ZmkIiwic2hvcnRfbmFtZSI6IuaWueWdl+a2iOmZpCIsImljb25zIjpbeyJzcmMiOiJpY29uLTE5Mi5wbmciLCJzaXplcyI6IjE5MngxOTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn0seyJzcmMiOiJpY29uLTUxMi5wbmciLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dLCJzdGFydF91cmwiOiJpbmRleC5odG1sIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBhMGEwYSIsInRoZW1lX2NvbG9yIjoiIzFhMWEyZSIsIm9yaWVudGF0aW9uIjoiYW55In0=">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAADRUlEQVR4nO3TMQ0CURRFwZVCjwYk4ABKqhVAgwoSQNMGDOCAkprmY2KT+5I3xXFwZhrzPFr33rVufp5bN8UHTFdgQgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAiA+YLj1gOgAKTAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPEB06UHTAdAgQkBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIDVAOzvY3RuXLetex0/rQOgwIQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAfMF16wHQAFJgQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADiA6ZLD5gOgAITAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAqwHYLI/Rue/p1rrD5dc6AApMCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8QHTpQdMB0CBCQEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAID5guvSA6QAoMCEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALBWf2xOp9rYfqMQAAAAAElFTkSuQmCC">
<title>方块消除</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,#16213e 100%);
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl);opacity:0}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

/* ===== Pages ===== */
.page{display:none;position:relative;z-index:1;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page.active{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}

/* ===== HOME PAGE ===== */
.home-inner{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:360px;padding:16px;min-height:100%;justify-content:center}
.home-title{font-size:2rem;font-weight:bold;color:#fff;text-align:center;letter-spacing:4px;text-shadow:0 0 30px rgba(255,215,0,.4)}
.home-subtitle{color:#888;font-size:.75rem;text-align:center;margin-top:-6px}
.home-board-preview{width:min(220px,55vw);height:min(220px,55vw);border:3px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(0,0,0,.4);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:1px;padding:2px;box-shadow:0 0 40px rgba(100,100,255,.1);flex-shrink:0}
.home-board-preview .mini-cell{background:rgba(255,255,255,.03);border-radius:2px}
.home-board-preview .mini-cell.filled{background:var(--fc);border-radius:3px}

.home-high-score{text-align:center}
.home-high-score .crown{font-size:2rem}
.home-high-score .hs-val{color:#ffd700;font-size:1.6rem;font-weight:bold;font-family:'Courier New',monospace}
.home-high-score .hs-label{color:#888;font-size:.6rem;text-transform:uppercase;letter-spacing:2px}

.home-mode-label{color:#888;font-size:.6rem;text-transform:uppercase;letter-spacing:2px;text-align:center}
.home-modes{display:flex;gap:6px;width:100%}
.home-mode-btn{flex:1;padding:10px 6px;border:2px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.05);color:#888;font-size:.7rem;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.home-mode-btn.active{border-color:#ffd700;color:#ffd700;background:rgba(255,215,0,.08)}

.home-mp-count{display:none;gap:6px;width:100%;margin-top:2px}
.home-mp-count.show{display:flex}
.home-mp-btn{flex:1;padding:8px 4px;border:2px solid rgba(249,115,22,.4);border-radius:10px;background:rgba(249,115,22,.08);color:#f97316;font-size:.7rem;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.home-mp-btn.active{border-color:#f97316;color:#fff;background:rgba(249,115,22,.25)}

.home-buttons{display:flex;flex-direction:column;gap:8px;width:100%}
.home-btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:.95rem;font-weight:bold;cursor:pointer;color:#fff;transition:all .2s;font-family:inherit;letter-spacing:1px}
.home-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 4px 20px rgba(102,126,234,.3)}
.home-btn.secondary{background:linear-gradient(135deg,#4facfe,#00f2fe);box-shadow:0 4px 20px rgba(79,172,254,.3)}
.home-btn.mp{background:linear-gradient(135deg,#f093fb,#f5576c);box-shadow:0 4px 20px rgba(245,87,108,.3)}
.home-btn:disabled{opacity:.35;pointer-events:none}

/* ===== ROOM PAGE ===== */
.room-inner{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:360px;padding:16px;min-height:100%;justify-content:center}
.room-back{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.75rem;z-index:2}
.room-card{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.room-card h3{color:#ccc;font-size:.8rem;text-align:center;letter-spacing:2px}
.room-code-display{font-size:3rem;font-weight:bold;text-align:center;color:#ffd700;letter-spacing:12px;font-family:'Courier New',monospace;text-shadow:0 0 20px rgba(255,215,0,.3);padding:8px}
.room-code-hint{color:#888;font-size:.65rem;text-align:center;margin-top:-6px}
.room-join-row{display:flex;gap:8px}
.room-join-input{flex:1;padding:10px 14px;border:2px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(0,0,0,.4);color:#fff;font-size:1.2rem;text-align:center;letter-spacing:8px;font-family:'Courier New',monospace;outline:none}
.room-join-input:focus{border-color:#4facfe}
.room-btn{width:100%;padding:11px;border:none;border-radius:10px;font-size:.85rem;font-weight:bold;cursor:pointer;color:#fff;transition:all .2s;font-family:inherit;letter-spacing:1px}
.room-btn.join{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.room-btn.leave{background:rgba(255,80,80,.2);border:1px solid rgba(255,80,80,.4);color:#ff5555;font-size:.75rem;margin-top:4px}
.room-btn:disabled{opacity:.35;pointer-events:none}

/* Player list */
.player-list{width:100%;display:flex;flex-direction:column;gap:6px}
.player-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.player-row .p-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:bold;flex-shrink:0}
.player-row .p-avatar.you{background:rgba(102,126,234,.3);color:#8ea4ff}
.player-row .p-avatar.other{background:rgba(249,115,22,.3);color:#fba86e}
.player-row .p-avatar.wait{background:rgba(255,255,255,.1);color:#666}
.player-row .p-info{flex:1;min-width:0}
.player-row .p-name{color:#ddd;font-size:.8rem;font-weight:bold}
.player-row .p-status{color:#888;font-size:.65rem}
.player-row .p-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.player-row .p-dot.online{background:#4ade80}
.player-row .p-dot.offline{background:#666}
.player-row .p-ready{font-size:.75rem;font-weight:bold;flex-shrink:0}
.player-row .p-ready.yes{color:#4ade80}
.player-row .p-ready.no{color:#666}

.room-status{text-align:center;color:#888;font-size:.72rem;min-height:20px}

/* ===== GAME PAGE ===== */
.game-page-inner{display:flex;flex-direction:column;width:100%;height:100%;max-width:420px;padding:4px 8px;gap:4px}

/* Top stats */
.game-stats{display:flex;gap:4px;flex-shrink:0;padding:2px 0}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:3px 6px;text-align:center;flex:1}
.stat-box h3{color:#888;font-size:.5rem;text-transform:uppercase;letter-spacing:1px}
.stat-box .val{color:#fff;font-size:.78rem;font-weight:bold;font-family:'Courier New',monospace}
.stat-box .val.gold{color:#ffd700}
.stat-box .val.green{color:#4ade80}

/* Board area */
.board-container{position:relative;touch-action:none;display:flex;justify-content:center;flex-shrink:0}
.board-frame{border:2px solid rgba(255,255,255,.2);border-radius:8px;box-shadow:0 0 30px rgba(100,100,255,.12),inset 0 0 30px rgba(0,0,0,.5);background:rgba(0,0,0,.5);contain:layout style}
.board-row{display:flex}
.board-cell{width:var(--cs);height:var(--cs);border:1px solid rgba(255,255,255,.1);background:#0e0e20;transition:background .12s;cursor:pointer}
.board-cell.filled{border-color:rgba(255,255,255,.15)}
.board-cell.preview{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.board-cell.invalid{background:rgba(255,50,50,.3)!important}
.board-cell.clearing{animation:flashClear .35s ease-out}
@keyframes flashClear{0%{background:rgba(255,255,255,.8)}100%{background:#0e0e20}}
.combo-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffd700;font-size:1.5rem;font-weight:bold;pointer-events:none;animation:comboUp .8s ease-out forwards;z-index:10;text-shadow:0 0 10px rgba(255,215,0,.6)}
@keyframes comboUp{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1.6)}}

.game-over-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.82);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .5s}
.game-over-overlay.active{opacity:1;pointer-events:all}
.game-over-overlay .go-title{font-size:1.6rem;font-weight:bold;color:#ff4444;text-shadow:0 0 20px rgba(255,68,68,.6)}
.game-over-overlay .go-score{color:#fff;font-size:1.1rem}
.game-over-overlay .go-sub{color:#aaa;font-size:.75rem}

/* MP overlay */
.mp-waiting{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border-radius:5px;pointer-events:all;z-index:5}
.mp-waiting .mpw-text{color:#ffd700;font-size:1rem;font-weight:bold;text-shadow:0 0 10px rgba(255,215,0,.4)}
.mp-waiting .mpw-sub{color:#aaa;font-size:.7rem}

/* Pieces section */
.pieces-section{display:flex;gap:6px;justify-content:center;align-items:center;flex-shrink:0;padding:4px 0;flex-wrap:wrap}
.pieces-section h3{color:#888;font-size:.55rem;text-transform:uppercase;letter-spacing:2px;writing-mode:vertical-lr;text-orientation:mixed}
.piece-slot{width:78px;height:78px;display:flex;justify-content:center;align-items:center;border:2px dashed rgba(255,255,255,.1);border-radius:10px;cursor:grab;transition:all .2s;touch-action:none;background:rgba(255,255,255,.02);position:relative;overflow:hidden;flex-shrink:0}
.piece-slot.selected{border-color:#ffd700;border-style:solid;background:rgba(255,215,0,.08)}
.piece-slot.my-piece{border-color:rgba(255,215,0,.5);border-style:solid}
.piece-slot.opponent-piece{border-color:rgba(255,255,255,.08);cursor:default;opacity:.5}
.piece-slot:hover:not(.selected):not(.opponent-piece){border-color:rgba(255,255,255,.3)}
.piece-slot .piece-inner{display:flex;flex-direction:column;align-items:center}
.piece-slot .prow{display:flex}
.piece-slot .pcell{width:var(--cs);height:var(--cs);border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);border-radius:1px}
.piece-slot .pcell.filled{border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),inset 0 -1px 2px rgba(0,0,0,.3)}
.piece-slot .owner-badge{position:absolute;top:3px;right:5px;font-size:.5rem;color:#ffd700;font-weight:bold;text-shadow:0 0 4px rgba(255,215,0,.6)}
.piece-slot .owner-badge.opp{color:#888}

/* Bottom actions */
.game-actions{display:flex;gap:8px;flex-shrink:0;padding:2px 0}
.btn-sm{flex:1;padding:10px 8px;border:none;border-radius:8px;font-size:.72rem;font-weight:bold;cursor:pointer;color:#fff;transition:all .2s;font-family:inherit;letter-spacing:1px}
.btn-undo{background:linear-gradient(135deg,#f093fb,#f5576c)}
.btn-menu{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.15)}
.btn-sm:hover{filter:brightness(1.15)}
.btn-sm:disabled{opacity:.4;pointer-events:none}

/* Drag clone */
.drag-clone{position:fixed;pointer-events:none;z-index:999;opacity:.85;transform:translate(-50%,-50%);display:flex;flex-direction:column;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.drag-clone .drow{display:flex}
.drag-clone .dcell{width:var(--cs);height:var(--cs);border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);border-radius:2px}
.drag-clone .dcell.filled{border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 3px rgba(255,255,255,.3)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,50,50,.9);color:#fff;padding:8px 20px;border-radius:8px;font-size:.75rem;z-index:100;animation:toastIn .3s ease-out;pointer-events:none}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.info{background:rgba(79,172,254,.9)}

/* Responsive piece slots */
@media(max-width:360px){
  .piece-slot{width:64px;height:64px}
  .game-stats{gap:2px}
  .stat-box{padding:3px 4px}
  }

  /* Language selector */
  .lang-selector{position:fixed;top:10px;right:16px;z-index:100;display:flex;gap:4px}
  .lang-flag{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);color:#fff;font-weight:bold;transition:all .2s}
  .lang-flag:hover{border-color:#ffd700;background:rgba(255,255,255,.25);transform:scale(1.1)}
  .lang-flag.active{border-color:#ffd700;background:rgba(255,215,0,.25);color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,.3)}

  /* How to play button */
  .how-to-btn{position:fixed;bottom:20px;right:16px;z-index:100;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .how-to-btn:hover{background:rgba(255,215,0,.2);border-color:#ffd700;color:#ffd700;transform:scale(1.1)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-card{background:#1a1814;border:1px solid #2e2b24;border-radius:16px;padding:28px;max-width:460px;width:100%;max-height:80vh;overflow-y:auto;color:#e8e2d4}
  .modal-card h2{color:#ffd700;font-size:1.3rem;margin-bottom:16px;text-align:center}
  .modal-card p,.modal-card li{font-size:14px;line-height:1.8;color:#ccc;margin-bottom:8px}
  .modal-card ul{padding-left:18px;margin-bottom:12px}
  .modal-close{display:block;margin:20px auto 0;padding:10px 30px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="lang-selector" id="langSelector">
  <div class="lang-flag active" data-lang="zh" title="中文">中</div>
  <div class="lang-flag" data-lang="en" title="English">EN</div>
  <div class="lang-flag" data-lang="es" title="Español">ES</div>
</div>

<!-- Page: How to Play -->
<button class="how-to-btn" id="btnHowTo" title="玩法介绍">?</button>

<div class="stars" id="stars"></div>

<!-- ============ HOME PAGE ============ -->
<div class="page active" id="homePage">
  <div class="home-inner">
    <div class="home-title">方块消除</div>
    <div class="home-subtitle">8×8 棋盘 · 行列消除</div>
    <div class="home-board-preview" id="homePreview"></div>
    <div class="home-high-score">
      <div class="crown">👑</div>
      <div class="hs-val" id="homeHighScore">0</div>
      <div class="hs-label">历史最高分</div>
    </div>
    <div class="home-mode-label">选择难度</div>
    <div class="home-modes" id="homeModes">
      <button class="home-mode-btn" data-mode="normal">⚡ 普通</button>
      <button class="home-mode-btn" data-mode="hard">🔥 困难</button>
      <button class="home-mode-btn" data-mode="multiplayer" id="btnMPMode">⚔️ 多人模式</button>
    </div>
    <div class="home-mp-count" id="homeMPCount">
      <button class="home-mp-btn active" data-count="2">👥 二人</button>
      <button class="home-mp-btn" data-count="3">👥 三人</button>
      <button class="home-mp-btn" data-count="4">👥 四人</button>
    </div>
    <div class="home-buttons">
      <button class="home-btn primary" id="btnNewGame">🎮 新游戏</button>
      <button class="home-btn secondary" id="btnContinue">▶ 继续游戏</button>
    </div>
  </div>
</div>

<!-- ============ ROOM PAGE ============ -->
<div class="page" id="roomPage">
  <button class="room-back" id="btnRoomBack">← 返回</button>
  <div class="room-inner">
    <div class="room-title" style="font-size:1.5rem;font-weight:bold;color:#fff;text-align:center;letter-spacing:2px">🏠 游戏房间</div>
    <div class="room-card" id="roomCreateCard">
      <h3>📋 创建房间</h3>
      <div class="room-code-display" id="roomCodeDisplay">----</div>
      <div class="room-code-hint" id="roomCodeHint">点击下方按钮生成房号</div>
      <button class="room-btn join" id="btnCreateRoom" style="background:linear-gradient(135deg,#667eea,#764ba2)">🏗 创建房间</button>
    </div>
    <div class="room-card" id="roomJoinCard">
      <h3>🔗 加入房间</h3>
      <div class="room-join-row">
        <input type="text" class="room-join-input" id="roomJoinInput" placeholder="输入房号" maxlength="4" inputmode="numeric" pattern="[0-9]*">
        <button class="room-btn join" id="btnJoinRoom">加入</button>
      </div>
    </div>
    <div class="player-list" id="playerList"></div>
    <div class="room-status" id="roomStatus">选择创建或加入房间</div>
    <button class="room-btn join" id="btnReady" disabled style="background:linear-gradient(135deg,#4ade80,#22c55e)">✅ 准备</button>
    <button class="room-btn join" id="btnUnready" disabled style="background:rgba(255,255,255,.1)">取消准备</button>
    <button class="room-btn leave" id="btnLeaveRoom">退出房间</button>
  </div>
</div>

<!-- ============ GAME PAGE ============ -->
<div class="page" id="gamePage">
  <div class="game-page-inner">
    <!-- Stats bar -->
    <div class="game-stats" id="gameStats">
      <div class="stat-box"><h3>🏆 分数</h3><div class="val" id="score">0</div></div>
      <div class="stat-box" id="statHighScore"><h3>👑 最高</h3><div class="val gold" id="highScore">0</div></div>
      <div class="stat-box"><h3>📊 消除</h3><div class="val" id="linesCleared">0</div></div>
      <div class="stat-box"><h3>🔥 连击</h3><div class="val" id="combo">0</div></div>
    </div>
    <!-- Board -->
    <div class="board-container" id="boardContainer">
      <div class="board-frame" id="boardFrame"></div>
      <div class="game-over-overlay" id="gameOver">
        <div class="go-title" id="goTitle">游戏结束</div>
        <div class="go-score" id="goScore">最终得分: 0</div>
        <div class="go-sub">点击"菜单"返回首页</div>
